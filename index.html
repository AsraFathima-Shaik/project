<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Registration Form</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f1eb;
            color: #333;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        header {
            background: #6d4c41;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 15px;
        }

        form {
            padding: 30px;
        }

        .section-title {
            color: #6d4c41;
            font-size: 21px;
            margin-bottom: 18px;
            margin-top: 10px;
            border-bottom: 2px solid #e0d6ce;
            padding-bottom: 8px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6d4c41;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 8px;
        }

        .radio-group label,
        .checkbox-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .radio-group input,
        .checkbox-group input {
            width: auto;
        }

        .terms {
            margin: 25px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terms input {
            width: auto;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 13px 28px;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .register-btn {
            background: #6d4c41;
            color: white;
        }

        .register-btn:hover {
            background: #50372f;
        }

        .reset-btn {
            background: #ddd;
            color: #333;
        }

        .reset-btn:hover {
            background: #c8c8c8;
        }

        footer {
            text-align: center;
            background: #f0ebe6;
            padding: 18px;
            color: #666;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .form-row {
                flex-direction: column;
                gap: 15px;
            }

            form {
                padding: 20px;
            }

            header h1 {
                font-size: 26px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Course Registration</h1>
        <p>Register for your preferred course and start your learning journey.</p>
    </header>


    <!-- FORM STARTS HERE -->

    <form action="https://formsubmit.co/YOUR_ADMIN_EMAIL@gmail.com"
          method="POST">

        <!-- Email settings -->

        <input type="hidden"
               name="_subject"
               value="New Course Registration">

        <input type="hidden"
               name="_template"
               value="table">

        <input type="hidden"
               name="_captcha"
               value="false">


        <!-- PERSONAL DETAILS -->

        <h2 class="section-title">Personal Details</h2>

        <div class="form-row">

            <div class="form-group">
                <label>First Name</label>
                <input type="text"
                       name="First Name"
                       placeholder="Enter your first name"
                       required>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text"
                       name="Last Name"
                       placeholder="Enter your last name"
                       required>
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="Student Email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel"
                       name="Phone Number"
                       placeholder="Enter your phone number"
                       required>
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date"
                       name="Date of Birth"
                       required>
            </div>

            <div class="form-group">

                <label>Gender</label>

                <div class="radio-group">

                    <label>
                        <input type="radio"
                               name="Gender"
                               value="Male"
                               required>
                        Male
                    </label>

                    <label>
                        <input type="radio"
                               name="Gender"
                               value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio"
                               name="Gender"
                               value="Other">
                        Other
                    </label>

                </div>

            </div>

        </div>


        <!-- EDUCATION DETAILS -->

        <h2 class="section-title">Education Details</h2>

        <div class="form-row">

            <div class="form-group">

                <label>Highest Qualification</label>

                <select name="Qualification" required>

                    <option value="">Select Qualification</option>
                    <option value="SSC">SSC</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Diploma">Diploma</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="B.E">B.E</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="M.Tech">M.Tech</option>
                    <option value="MCA">MCA</option>
                    <option value="Other">Other</option>

                </select>

            </div>


            <div class="form-group">

                <label>Passing Year</label>

                <select name="Passing Year" required>

                    <option value="">Select Year</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>

                </select>

            </div>

        </div>


        <!-- COURSE DETAILS -->

        <h2 class="section-title">Course Details</h2>

        <div class="form-row">

            <div class="form-group">

                <label>Select Course</label>

                <select name="Course" required>

                    <option value="">Select Course</option>

                    <option value="Java Full Stack">
                        Java Full Stack
                    </option>

                    <option value="Python Full Stack">
                        Python Full Stack
                    </option>

                    <option value="Data Science">
                        Data Science
                    </option>

                    <option value="Data Analytics">
                        Data Analytics
                    </option>

                    <option value="Web Development">
                        Web Development
                    </option>

                    <option value="AWS and Cloud">
                        AWS and Cloud
                    </option>

                    <option value="Digital Marketing">
                        Digital Marketing
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Learning Mode</label>

                <select name="Learning Mode" required>

                    <option value="">Select Mode</option>
                    <option value="Online">Online</option>
                    <option value="Offline">Offline</option>
                    <option value="Hybrid">Hybrid</option>

                </select>

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Preferred Batch</label>

                <select name="Preferred Batch" required>

                    <option value="">Select Batch</option>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>

                </select>

            </div>


            <div class="form-group">

                <label>Programming Experience</label>

                <select name="Programming Experience" required>

                    <option value="">Select Experience</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                    <option value="No Experience">No Experience</option>

                </select>

            </div>

        </div>


        <!-- SKILLS -->

        <h2 class="section-title">Technical Skills</h2>

        <div class="checkbox-group">

            <label>
                <input type="checkbox"
                       name="Skills"
                       value="HTML">
                HTML
            </label>

            <label>
                <input type="checkbox"
                       name="Skills"
                       value="CSS">
                CSS
            </label>

            <label>
                <input type="checkbox"
                       name="Skills"
                       value="Java">
                Java
            </label>

            <label>
                <input type="checkbox"
                       name="Skills"
                       value="Python">
                Python
            </label>

            <label>
                <input type="checkbox"
                       name="Skills"
                       value="SQL">
                SQL
            </label>

            <label>
                <input type="checkbox"
                       name="Skills"
                       value="JavaScript">
                JavaScript
            </label>

        </div>


        <!-- ADDRESS -->

        <h2 class="section-title">Address</h2>

        <div class="form-group">

            <label>Full Address</label>

            <textarea name="Address"
                      placeholder="Enter your full address"
                      required></textarea>

        </div>


        <!-- ADDITIONAL INFORMATION -->

        <h2 class="section-title">Additional Information</h2>

        <div class="form-group">

            <label>Why do you want to join this course?</label>

            <textarea name="Additional Information"
                      placeholder="Write something about your learning goals..."></textarea>

        </div>


        <!-- TERMS -->

        <div class="terms">

            <input type="checkbox"
                   id="terms"
                   name="Terms"
                   value="Accepted"
                   required>

            <label for="terms">
                I confirm that the information provided is correct.
            </label>

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button type="submit"
                    class="register-btn">
                Register Now
            </button>

            <button type="reset"
                    class="reset-btn">
                Reset
            </button>

        </div>

    </form>


    <footer>
        © 2026 Course Registration | All Rights Reserved
    </footer>

</div>

</body>
</html>
